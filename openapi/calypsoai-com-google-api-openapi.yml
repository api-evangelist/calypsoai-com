openapi: 3.2.0
info:
  title: CalypsoAI Google API
  version: 1.0.0
servers:
- description: US1 availability zone
  url: https://us1.calypsoai.app
- description: EU1 availability zone
  url: https://eu1.calypsoai.app
tags:
- name: Google
paths:
  /google/{provider}/v1beta/models/{model}:{methodName}:
    post:
      description: 'Send a generateContent request to the specified provider using compatible format.

        The request will be processed through the configured guardrails and security policies

        before being forwarded to the provider.'
      operationId: post_google_provider_v1beta_models_model:methodName
      parameters:
      - in: path
        name: provider
        required: true
        schema:
          title: Provider
          type: string
      - in: path
        name: model
        required: true
        schema:
          title: Model
          type: string
      - in: path
        name: methodName
        required: true
        schema:
          $ref: '#/components/schemas/GoogleGenerateContentMethod'
      - in: query
        name: alt
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Alt
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostGoogleGenerateContentBody'
        required: true
      responses:
        '200':
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Google gemini generateContent API gateway
      tags:
      - Google
components:
  schemas:
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
    GoogleGenerateContentMethod:
      enum:
      - generateContent
      - streamGenerateContent
      title: GoogleGenerateContentMethod
      type: string
    PostGoogleGenerateContentBody:
      additionalProperties: true
      properties:
        contents:
          items:
            additionalProperties: true
            type: object
          title: Contents
          type: array
      required:
      - contents
      title: PostGoogleGenerateContentBody
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
  securitySchemes:
    HTTPBearer:
      scheme: bearer
      type: http
