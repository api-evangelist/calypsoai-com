openapi: 3.2.0
info:
  title: CalypsoAI Projects API
  version: 1.0.0
servers:
- description: US1 availability zone
  url: https://us1.calypsoai.app
- description: EU1 availability zone
  url: https://eu1.calypsoai.app
tags:
- name: Projects
paths:
  /backend/v1/projects:
    get:
      description: 'Retrieves a list of projects that match the given criteria,

        with the option to adjust the limit for more results.'
      operationId: get_projects
      parameters:
      - description: Selects page for paginated results. Pass in the next or prev attribute in the response
        in: query
        name: cursor
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Selects page for paginated results. Pass in the next or prev attribute in the response
          title: Cursor
      - description: Only return results that match the given text.
        in: query
        name: search
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Only return results that match the given text.
          title: Search
      - description: Limits the amount of results.
        in: query
        name: limit
        required: false
        schema:
          default: 10
          description: Limits the amount of results.
          maximum: 100
          minimum: 1
          title: Limit
          type: integer
      - description: Whether results should be sorted in ascending order.
        in: query
        name: ascending
        required: false
        schema:
          default: false
          description: Whether results should be sorted in ascending order.
          title: Ascending
          type: boolean
      - description: Filter projects by these types.
        in: query
        name: type
        required: false
        schema:
          anyOf:
          - items:
              $ref: '#/components/schemas/ProjectType'
            type: array
          - type: 'null'
          description: Filter projects by these types.
          title: Type
      - description: Filter by projects that have these providers added.
        in: query
        name: providerId
        required: false
        schema:
          anyOf:
          - items:
              format: uuid
              type: string
            type: array
          - type: 'null'
          description: Filter by projects that have these providers added.
          title: Providerid
      - description: Sort results by the given parameter.
        in: query
        name: sortBy
        required: false
        schema:
          $ref: '#/components/schemas/ProjectSearchSortBy'
          default: created_at
          description: Sort results by the given parameter.
      - description: Get projects that the current user is/isn't admin of.
        in: query
        name: admin
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          description: Get projects that the current user is/isn't admin of.
          title: Admin
      - description: Filter by projects created by the specified user.
        in: query
        name: createdBy
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by projects created by the specified user.
          title: Createdby
      - description: Filter projects by their deployment status.
        in: query
        name: deploymentStatus
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/ProjectDeploymentStatus'
          - type: 'null'
          description: Filter projects by their deployment status.
          title: Deploymentstatus
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetProjectsResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Get projects
      tags:
      - Projects
    post:
      description: Creates a new project
      operationId: post_projects
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostProjectsBody'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostSuccessMessage'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Create project
      tags:
      - Projects
  /backend/v1/projects/{project}:
    delete:
      description: 'Deletes a project.

        Only an org admin can delete projects.'
      operationId: delete_projects_project
      parameters:
      - in: path
        name: project
        required: true
        schema:
          anyOf:
          - format: uuid
            type: string
          - type: string
          title: Project
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Delete project
      tags:
      - Projects
    get:
      description: Retrieves a project by its ID or name.
      operationId: get_projects_project
      parameters:
      - in: path
        name: project
        required: true
        schema:
          anyOf:
          - format: uuid
            type: string
          - type: string
          title: Project
      - description: Get the config at a given point in time.
        in: query
        name: configAt
        required: false
        schema:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          description: Get the config at a given point in time.
          title: Configat
      - description: Include full guardrail, guardrail package, and provider objects added to the project.
        in: query
        name: includeAdded
        required: false
        schema:
          default: false
          description: Include full guardrail, guardrail package, and provider objects added to the project.
          title: Includeadded
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetProjectResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Get project by ID or name
      tags:
      - Projects
    patch:
      description: Modifies a project, including its name, friendly ID and configuration.
      operationId: patch_projects_project
      parameters:
      - in: path
        name: project
        required: true
        schema:
          anyOf:
          - format: uuid
            type: string
          - type: string
          title: Project
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchProjectBody'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Update project
      tags:
      - Projects
  /backend/v1/projects/{project}/members:
    post:
      description: Only a project admin can add users to a project.
      operationId: post_projects_project_members
      parameters:
      - in: path
        name: project
        required: true
        schema:
          anyOf:
          - format: uuid
            type: string
          - type: string
          title: Project
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostProjectMembersBody'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Add users to project
      tags:
      - Projects
  /backend/v1/projects/{project}/members/{userId}:
    delete:
      description: Removes a user from a project. Only a project admin can perform this action.
      operationId: delete_projects_project_members_userId
      parameters:
      - in: path
        name: project
        required: true
        schema:
          anyOf:
          - format: uuid
            type: string
          - type: string
          title: Project
      - in: path
        name: userId
        required: true
        schema:
          title: Userid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Remove user from project
      tags:
      - Projects
    patch:
      description: Updates a user's admin status within a project. Only project admins can modify a user's admin status.
      operationId: patch_projects_project_members_userId
      parameters:
      - in: path
        name: project
        required: true
        schema:
          anyOf:
          - format: uuid
            type: string
          - type: string
          title: Project
      - in: path
        name: userId
        required: true
        schema:
          title: Userid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchProjectMemberBody'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Update project user
      tags:
      - Projects
  /backend/v1/projects/{project}/providers/{providerId}:
    delete:
      description: Remove provider from project.
      operationId: delete_projects_project_providers_providerId
      parameters:
      - in: path
        name: project
        required: true
        schema:
          anyOf:
          - format: uuid
            type: string
          - type: string
          title: Project
      - in: path
        name: providerId
        required: true
        schema:
          format: uuid
          title: Providerid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Remove provider from project
      tags:
      - Projects
    post:
      description: Add provider to project.
      operationId: post_projects_project_providers_providerId
      parameters:
      - in: path
        name: project
        required: true
        schema:
          anyOf:
          - format: uuid
            type: string
          - type: string
          title: Project
      - in: path
        name: providerId
        required: true
        schema:
          format: uuid
          title: Providerid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Add provider to project
      tags:
      - Projects
  /backend/v1/projects/{project}/scanner-packages/{scannerPackageId}:
    delete:
      description: Remove guardrail package from project.
      operationId: delete_projects_project_scanner_packages_scannerPackageId
      parameters:
      - in: path
        name: project
        required: true
        schema:
          anyOf:
          - format: uuid
            type: string
          - type: string
          title: Project
      - in: path
        name: scannerPackageId
        required: true
        schema:
          format: uuid
          title: Scannerpackageid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Remove guardrail package from project
      tags:
      - Projects
    post:
      description: Add scanner_package to project.
      operationId: post_projects_project_scanner_packages_scannerPackageId
      parameters:
      - in: path
        name: project
        required: true
        schema:
          anyOf:
          - format: uuid
            type: string
          - type: string
          title: Project
      - in: path
        name: scannerPackageId
        required: true
        schema:
          format: uuid
          title: Scannerpackageid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Add scanner_package to project
      tags:
      - Projects
  /backend/v1/projects/{project}/scanners:
    get:
      description: 'Retrieves all guardrails and their configurations

        used when sending prompts or performing scans within the project.'
      operationId: get_projects_project_scanners
      parameters:
      - in: path
        name: project
        required: true
        schema:
          format: uuid
          title: Project
          type: string
      - description: Get the config at a given point in time.
        in: query
        name: configAt
        required: false
        schema:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          description: Get the config at a given point in time.
          title: Configat
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetProjectScannersResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Get project guardrails
      tags:
      - Projects
  /backend/v1/projects/{project}/scanners/{scannerId}:
    delete:
      description: Remove guardrail from project.
      operationId: delete_projects_project_scanners_scannerId
      parameters:
      - in: path
        name: project
        required: true
        schema:
          anyOf:
          - format: uuid
            type: string
          - type: string
          title: Project
      - in: path
        name: scannerId
        required: true
        schema:
          format: uuid
          title: Scannerid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Remove guardrail from project
      tags:
      - Projects
    post:
      description: Add guardrail to project.
      operationId: post_projects_project_scanners_scannerId
      parameters:
      - in: path
        name: project
        required: true
        schema:
          anyOf:
          - format: uuid
            type: string
          - type: string
          title: Project
      - in: path
        name: scannerId
        required: true
        schema:
          format: uuid
          title: Scannerid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Add guardrail to project
      tags:
      - Projects
components:
  schemas:
    ScannerAvailability:
      properties:
        global:
          default: false
          description: If True guardrail can be used by all projects
          title: Global
          type: boolean
        projectIds:
          default: []
          items:
            format: uuid
            type: string
          title: Projectids
          type: array
          uniqueItems: true
      title: ScannerAvailability
      type: object
    ScannerVersionMeta:
      properties:
        createdAt:
          format: date-time
          title: Createdat
          type: string
        createdBy:
          anyOf:
          - type: string
          - type: 'null'
          title: Createdby
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        direction:
          anyOf:
          - $ref: '#/components/schemas/ScannerDirection'
          - type: 'null'
        f1Score:
          anyOf:
          - type: number
          - type: 'null'
          title: F1Score
        id:
          format: uuid
          title: Id
          type: string
        latestDatasetResult:
          anyOf:
          - $ref: '#/components/schemas/ScannerDatasetResult'
          - type: 'null'
        name:
          maxLength: 100
          minLength: 1
          pattern: ^[a-zA-Z0-9-_]+$
          title: Name
          type: string
        published:
          title: Published
          type: boolean
      required:
      - id
      - createdAt
      - name
      - published
      title: ScannerVersionMeta
      type: object
    ProjectDeploymentStatus:
      enum:
      - live
      - draft
      title: ProjectDeploymentStatus
      type: string
    ProjectType:
      enum:
      - app
      - bot
      - chat
      - global
      - agentic
      - red_team
      title: ProjectType
      type: string
    APIScopeOutputs:
      patternProperties:
        ^[a-zA-Z_][a-zA-Z0-9_]*$:
          type: string
      template: true
      title: APIScopeOutputs
      type: object
    ProviderAvailability:
      properties:
        global:
          default: false
          description: If True provider can be used by all projects
          title: Global
          type: boolean
        projectIds:
          default: []
          items:
            format: uuid
            type: string
          title: Projectids
          type: array
          uniqueItems: true
      title: ProviderAvailability
      type: object
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
    APIWorkflowBlock:
      properties:
        outputs:
          $ref: '#/components/schemas/APIScopeOutputs'
          default: {}
        stages:
          items:
            discriminator:
              mapping:
                request: '#/components/schemas/APIRequestBlock'
                retry: '#/components/schemas/APIRetryBlock'
                workflow: '#/components/schemas/APIWorkflowBlock'
              propertyName: type
            oneOf:
            - $ref: '#/components/schemas/APIRequestBlock'
            - $ref: '#/components/schemas/APIRetryBlock'
            - $ref: '#/components/schemas/APIWorkflowBlock'
          template: true
          title: Stages
          type: array
        type:
          const: workflow
          default: workflow
          title: Type
          type: string
      required:
      - stages
      title: APIWorkflowBlock
      type: object
    GetProjectsResponse:
      properties:
        next:
          anyOf:
          - type: string
          - type: 'null'
          description: Cursor to the next page, if any.
          title: Next
        prev:
          anyOf:
          - type: string
          - type: 'null'
          description: Cursor to the previous page, if any.
          title: Prev
        projects:
          description: Projects matching the given filter criteria.
          items:
            $ref: '#/components/schemas/Project'
          title: Projects
          type: array
      required:
      - projects
      title: GetProjectsResponse
      type: object
    MLTextScannerConfig:
      properties:
        type:
          const: ml_text
          default: ml_text
          title: Type
          type: string
      required: []
      title: MLTextScannerConfig
      type: object
    SuccessMessage:
      description: Confirms a successful operation.
      properties:
        message:
          title: Message
          type: string
      required:
      - message
      title: SuccessMessage
      type: object
    ScannerPackage:
      properties:
        availability:
          $ref: '#/components/schemas/ScannerAvailability'
          default:
            global: false
            projectIds: []
        direction:
          $ref: '#/components/schemas/ScannerDirection'
        id:
          format: uuid
          title: Id
          type: string
        name:
          title: Name
          type: string
        performanceScannerIds:
          anyOf:
          - items:
              format: uuid
              type: string
            type: array
          - type: 'null'
          title: Performancescannerids
        projectId:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Projectid
        scannerCounts:
          additionalProperties:
            type: integer
          default: {}
          title: Scannercounts
          type: object
        scannerIds:
          items:
            format: uuid
            type: string
          title: Scannerids
          type: array
        source:
          discriminator:
            mapping:
              internal: '#/components/schemas/InternalScannerSource'
              remediation: '#/components/schemas/RemediationScannerSource'
              vendor: '#/components/schemas/VendorScannerSource'
              zip: '#/components/schemas/ZipScannerSource'
            propertyName: type
          oneOf:
          - $ref: '#/components/schemas/InternalScannerSource'
          - $ref: '#/components/schemas/ZipScannerSource'
          - $ref: '#/components/schemas/VendorScannerSource'
          - $ref: '#/components/schemas/RemediationScannerSource'
          title: Source
        vendored:
          anyOf:
          - type: boolean
          - items:
              type: string
            type: array
          default: false
          title: Vendored
      required:
      - id
      - name
      - source
      - direction
      - scannerIds
      title: ScannerPackage
      type: object
    RegexScannerConfig:
      properties:
        pattern:
          description: Python Flavored Regular Expression (RegEx) to check for in the prompt or response. Case insensitive.
          title: Pattern
          type: string
        type:
          const: regex
          default: regex
          title: Type
          type: string
      required:
      - pattern
      title: RegexScannerConfig
      type: object
    ZipScannerSource:
      properties:
        type:
          const: zip
          default: zip
          title: Type
          type: string
      title: ZipScannerSource
      type: object
    ProviderType:
      enum:
      - ibm
      - openai
      - azure
      - cohere
      - ai21
      - custom
      - anthropic
      - groq
      - openai-compatible
      - huggingface
      - siem
      - google
      - bedrock
      title: ProviderType
      type: string
    GetProjectResponse:
      properties:
        project:
          $ref: '#/components/schemas/Project'
          description: Requested project object.
        providers:
          anyOf:
          - items:
              $ref: '#/components/schemas/Provider'
            type: array
          - type: 'null'
          description: Providers added to the project. Only populated when includeAdded is true.
          title: Providers
        scannerPackages:
          anyOf:
          - items:
              $ref: '#/components/schemas/ScannerPackage'
            type: array
          - type: 'null'
          description: Guardrail packages added to the project. Only populated when includeAdded is true.
          title: Scannerpackages
        scanners:
          anyOf:
          - items:
              $ref: '#/components/schemas/Scanner'
            type: array
          - type: 'null'
          description: Guardrails added to the project. Only populated when includeAdded is true.
          title: Scanners
        truncated:
          anyOf:
          - type: boolean
          - type: 'null'
          description: True if any category exceeded the per-category limit. Only set when includeAdded is true.
          title: Truncated
      required:
      - project
      title: GetProjectResponse
      type: object
    ProjectScanners:
      properties:
        configs:
          additionalProperties:
            $ref: '#/components/schemas/ProjectConfigScanner'
          default: {}
          description: Behaviour of each guardrails specific to the project, such as whether to block flagged prompts
          propertyNames:
            format: uuid
          title: Configs
          type: object
        forcedScanners:
          additionalProperties:
            anyOf:
            - $ref: '#/components/schemas/Scanner'
            - items:
                $ref: '#/components/schemas/Scanner'
              type: array
          default: {}
          description: 'Guardrails enabled for the project which were enabled by the global setting''s admin.

            A list value indicates multiple versions of a guardrail that were enabled (Playground prompts only).'
          propertyNames:
            format: uuid
          title: Forcedscanners
          type: object
        scanners:
          additionalProperties:
            $ref: '#/components/schemas/Scanner'
          default: {}
