openapi: 3.2.0
info:
  title: CalypsoAI Campaign Runs API
  version: 1.0.0
servers:
- description: US1 availability zone
  url: https://us1.calypsoai.app
- description: EU1 availability zone
  url: https://eu1.calypsoai.app
tags:
- name: Campaign-Runs
paths:
  /backend/v1/campaign-runs:
    get:
      description: 'Retrieves a list of campaign runs that match the given criteria,

        with the option to adjust the limit for more results.'
      operationId: get_campaign_runs
      parameters:
      - description: Selects page for paginated results. Pass in the next or prev attribute in the response
        in: query
        name: cursor
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Selects page for paginated results. Pass in the next or prev attribute in the response
          title: Cursor
      - description: Only return results that match the given text.
        in: query
        name: search
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Only return results that match the given text.
          title: Search
      - description: Limits the amount of results.
        in: query
        name: limit
        required: false
        schema:
          default: 10
          description: Limits the amount of results.
          maximum: 100
          minimum: 1
          title: Limit
          type: integer
      - description: Whether results should be sorted in ascending order.
        in: query
        name: ascending
        required: false
        schema:
          default: false
          description: Whether results should be sorted in ascending order.
          title: Ascending
          type: boolean
      - description: Only return results from before this timestamp.
        in: query
        name: before
        required: false
        schema:
          anyOf:
          - format: date-time
            type: string
          - format: uuid
            type: string
          - type: 'null'
          description: Only return results from before this timestamp.
          title: Before
      - description: Only return results from after this timestamp.
        in: query
        name: after
        required: false
        schema:
          anyOf:
          - format: date-time
            type: string
          - format: uuid
            type: string
          - type: 'null'
          description: Only return results from after this timestamp.
          title: After
      - description: Filter by campaign runs with names that match this value.
        in: query
        name: name
        required: false
        schema:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          description: Filter by campaign runs with names that match this value.
          title: Name
      - description: Filter by campaign runs shared with this Red Team project.
        in: query
        name: projectId
        required: false
        schema:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          description: Filter by campaign runs shared with this Red Team project.
          title: Projectid
      - description: Filter by campaign runs in this schedule.
        in: query
        name: campaignScheduleId
        required: false
        schema:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          description: Filter by campaign runs in this schedule.
          title: Campaignscheduleid
      - description: Filter by campaign runs with any of these statuses.
        in: query
        name: status
        required: false
        schema:
          anyOf:
          - items:
              $ref: '#/components/schemas/CampaignRunStatus'
            type: array
          - type: 'null'
          description: Filter by campaign runs with any of these statuses.
          title: Status
      - description: Filter by provider that the campaign was run against.
        in: query
        name: providerId
        required: false
        schema:
          anyOf:
          - items:
              format: uuid
              type: string
            type: array
          - type: 'null'
          description: Filter by provider that the campaign was run against.
          title: Providerid
      - description: Filter by users that created the campaign runs.
        in: query
        name: createdBy
        required: false
        schema:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          description: Filter by users that created the campaign runs.
          title: Createdby
      - description: Only return campaign runs with a score between range.
        in: query
        name: scoreRange
        required: false
        schema:
          anyOf:
          - items:
              $ref: '#/components/schemas/CampaignRunScoreRating'
            type: array
          - type: 'null'
          description: Only return campaign runs with a score between range.
          title: Scorerange
      - description: Include providers that the campaign was run against.
        in: query
        name: includeProviders
        required: false
        schema:
          default: false
          description: Include providers that the campaign was run against.
          title: Includeproviders
          type: boolean
      - description: Include remediations that were created from the campaign runs.
        in: query
        name: includeRemediations
        required: false
        schema:
          default: false
          description: Include remediations that were created from the campaign runs.
          title: Includeremediations
          type: boolean
      - description: Include campaigns.
        in: query
        name: includeCampaigns
        required: false
        schema:
          default: false
          description: Include campaigns.
          title: Includecampaigns
          type: boolean
      - description: Include campaign schedules.
        in: query
        name: includeSchedules
        required: false
        schema:
          default: false
          description: Include campaign schedules.
          title: Includeschedules
          type: boolean
      - description: Include users.
        in: query
        name: includeUsers
        required: false
        schema:
          default: false
          description: Include users.
          title: Includeusers
          type: boolean
      - description: Sort results by the given parameter.
        in: query
        name: sortBy
        required: false
        schema:
          $ref: '#/components/schemas/CampaignRunSearchSortBy'
          default: created_at
          description: Sort results by the given parameter.
      - description: Filter by campaign runs that are preserved or not.
        in: query
        name: preserve
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          description: Filter by campaign runs that are preserved or not.
          title: Preserve
      - description: Filter by model name.
        in: query
        name: model
        required: false
        schema:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          description: Filter by model name.
          title: Model
      - description: Filter by campaign runs that are vendored or not.
        in: query
        name: vendored
        required: false
        schema:
          default: false
          description: Filter by campaign runs that are vendored or not.
          title: Vendored
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetCampaignRunsResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Get campaign runs
      tags:
      - Campaign-Runs
    post:
      description: Runs the campaign using the specified providers. The provided name helps identify the campaign run.
      operationId: post_campaign_runs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostRunCampaignBody'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostSuccessMessage'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Run campaign
      tags:
      - Campaign-Runs
  /backend/v1/campaign-runs/{campaignRunId}:
    delete:
      description: Deletes a campaign run.
      operationId: delete_campaign_runs_campaignRunId
      parameters:
      - in: path
        name: campaignRunId
        required: true
        schema:
          format: uuid
          title: Campaignrunid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Delete a campaign run
      tags:
      - Campaign-Runs
    get:
      description: 'Returns a campaign run based on its ID. Optional parameters allow including results,

        providers, and schedule objects in the response.'
      operationId: get_campaign_runs_campaignRunId
      parameters:
      - in: path
        name: campaignRunId
        required: true
        schema:
          format: uuid
          title: Campaignrunid
          type: string
      - deprecated: true
        description: Include attack results in response. Deprecated, use GET /campaign-runs/{id}/results
        in: query
        name: includeResults
        required: false
        schema:
          default: false
          deprecated: true
          description: Include attack results in response. Deprecated, use GET /campaign-runs/{id}/results
          title: Includeresults
          type: boolean
      - description: Include providers that the campaign was run against
        in: query
        name: includeProviders
        required: false
        schema:
          default: false
          description: Include providers that the campaign was run against
          title: Includeproviders
          type: boolean
      - description: Include the campaign run's schedule if it has one
        in: query
        name: includeSchedule
        required: false
        schema:
          default: false
          description: Include the campaign run's schedule if it has one
          title: Includeschedule
          type: boolean
      - description: Include the campaign run's campaign
        in: query
        name: includeCampaign
        required: false
        schema:
          default: false
          description: Include the campaign run's campaign
          title: Includecampaign
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetCampaignRunResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Get campaign run
      tags:
      - Campaign-Runs
    patch:
      description: Modifies the campaign run's status, name and start time.
      operationId: patch_campaign_runs_campaignRunId
      parameters:
      - in: path
        name: campaignRunId
        required: true
        schema:
          format: uuid
          title: Campaignrunid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchCampaignRunBody'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Update campaign run
      tags:
      - Campaign-Runs
  /backend/v1/campaign-runs/{campaignRunId}/access:
    get:
      operationId: get_campaign_runs_campaignRunId_access
      parameters:
      - in: path
        name: campaignRunId
        required: true
        schema:
          format: uuid
          title: Campaignrunid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignRunProjectAccess'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Get
      tags:
      - Campaign-Runs
    patch:
      operationId: patch_campaign_runs_campaignRunId_access
      parameters:
      - in: path
        name: campaignRunId
        required: true
        schema:
          format: uuid
          title: Campaignrunid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchCampaignRunProjectAccessBody'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Patch
      tags:
      - Campaign-Runs
  /backend/v1/campaign-runs/{campaignRunId}/results:
    get:
      description: 'Retrieves the campaign run''s attack results that match the given filters. Values within a filter are

        combined with OR, and different filters with AND.'
      operationId: get_campaign_runs_campaignRunId_results
      parameters:
      - in: path
        name: campaignRunId
        required: true
        schema:
          format: uuid
          title: Campaignrunid
          type: string
      - description: Selects page for paginated results. Pass in the next or prev attribute in the response
        in: query
        name: cursor
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Selects page for paginated results. Pass in the next or prev attribute in the response
          title: Cursor
      - description: Only return results from these providers.
        in: query
        name: providerId
        required: false
        schema:
          anyOf:
          - items:
              format: uuid
              type: string
            type: array
          - type: 'null'
          description: Only return results from these providers.
          title: Providerid
      - description: Only return results from these attack vectors.
        in: query
        name: vector
        required: false
        schema:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          description: Only return results from these attack vectors.
          title: Vector
      - description: Only return results from these techniques.
        in: query
        name: technique
        required: false
        schema:
          anyOf:
          - items:
              $ref: '#/components/schemas/AttackTechnique'
            type: array
          - type: 'null'
          description: Only return results from these techniques.
          title: Technique
      - description: Only return results that are (or aren't) vulnerable.
        in: query
        name: vulnerable
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          description: Only return results that are (or aren't) vulnerable.
          title: Vulnerable
      - description: Only return results that did (or didn't) error.
        in: query
        name: error
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          description: Only return results that did (or didn't) error.
          title: Error
      - description: Only return results with these severities.
        in: query
        name: severity
        required: false
        schema:
          anyOf:
          - items:
              maximum: 4
              minimum: 1
              type: integer
            type: array
          - type: 'null'
          description: Only return results with these severities.
          title: Severity
      - description: Only return results with these intent categories.
        in: query
        name: intentCategory
        required: false
        schema:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          description: Only return results with these intent categories.
          title: Intentcategory
      - description: Only return results with these intent types. `signature` matches static content results.
        in: query
        name: intentType
        required: false
        schema:
          anyOf:
          - items:
              anyOf:
              - $ref: '#/components/schemas/IntentType'
              - const: signature
                type: string
            type: array
          - type: 'null'
          description: Only return results with these intent types. `signature` matches static content results.
          title: Intenttype
      - description: Only return results with these converters. `none` matches results without a converter.
        in: query
        name: converter
        required: false
        schema:
          anyOf:
          - items:
              anyOf:
              - $ref: '#/components/schemas/PromptConverter'
              - const: none
                type: string
            type: array
          - type: 'null'
          description: Only return results with these converters. `none` matches results without a converter.
          title: Converter
      - description: Only return results with these intents.
        in: query
        name: intent
        required: false
        schema:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          description: Only return results with these intents.
          title: Intent
      - description: Only return results whose intent, error or conversation match the given text.
        in: query
        name: search
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Only return results whose intent, error or conversation match the given text.
          title: Search
      - description: Limits the amount of results.
        in: query
        name: limit
        required: false
        schema:
          default: 50
          description: Limits the amount of results.
          maximum: 500
          minimum: 1
          title: Limit
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetCampaignRunResultsResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Get campaign run results
      tags:
      - Campaign-Runs
  /backend/v1/campaign-runs/{campaignRunId}/retry:
    post:
      operationId: post_campaign_runs_campaignRunId_retry
      parameters:
      - in: path
        name: campaignRunId
        required: true
        schema:
          format: uuid
          title: Campaignrunid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Post
      tags:
      - Campaign-Runs
components:
  schemas:
    PromptConverter:
      enum:
      - base64
      - leetspeak
      - unicode_confusable
      - caesar
      - repeat_token
      - single_character
      title: PromptConverter
      type: string
    RemediationResult:
      properties:
        intentScores:
          items:
            $ref: '#/components/schemas/RemediationIntentScores'
          title: Intentscores
          type: array
        metrics:
          anyOf:
          - $ref: '#/components/schemas/RemediationEvaluationMetrics'
          - type: 'null'
        resultFileId:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Resultfileid
        scanners:
          items:
            $ref: '#/components/schemas/RemediationResultScanner'
          title: Scanners
          type: array
        scores:
          $ref: '#/components/schemas/RemediationScores'
      required:
      - scanners
      - scores
      - intentScores
      title: RemediationResult
      type: object
    HTTPMethod:
      enum:
      - GET
      - POST
      - PUT
      - DELETE
      - PATCH
      - HEAD
      - OPTIONS
      title: HTTPMethod
      type: string
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    PostSuccessMessage:
      description: Contains the ID of an object after a successful POST operation.
      properties:
        id:
          anyOf:
          - format: uuid
            type: string
          - type: string
          title: Id
      required:
      - id
      title: PostSuccessMessage
      type: object
    APIRetryBlock:
      properties:
        attempts:
          title: Attempts
          type: integer
        backoff:
          anyOf:
          - type: integer
          - type: string
          default: 1
          template: true
          title: Backoff
        block:
          discriminator:
            mapping:
              request: '#/components/schemas/APIRequestBlock'
              retry: '#/components/schemas/APIRetryBlock'
              workflow: '#/components/schemas/APIWorkflowBlock'
            propertyName: type
          oneOf:
          - $ref: '#/components/schemas/APIRequestBlock'
          - $ref: '#/components/schemas/APIWorkflowBlock'
          - $ref: '#/components/schemas/APIRetryBlock'
          template: true
          title: Block
        type:
          const: retry
          default: retry
          title: Type
          type: string
        when:
          anyOf:
          - type: string
          - type: 'null'
          template: true
          title: When
      required:
      - attempts
      - block
      title: APIRetryBlock
      type: object
    AttackRunScheduledEvent:
      properties:
        createdAt:
          format: date-time
          title: Createdat
          type: string
        event:
          const: scheduled
          default: scheduled
          title: Event
          type: string
        scheduledStartTime:
          format: date-time
          title: Scheduledstarttime
          type: string
      required:
      - createdAt
      - scheduledStartTime
      title: AttackRunScheduledEvent
      type: object
    RemediationDeployment:
      properties:
        comment:
          anyOf:
          - type: string
          - type: 'null'
          title: Comment
        createdAt:
          format: date-time
          title: Createdat
          type: string
        createdBy:
          anyOf:
          - type: string
          - type: 'null'
          title: Createdby
        projectIds:
          items:
            format: uuid
            type: string
          title: Projectids
          type: array
        rejected:
          title: Rejected
          type: boolean
        scannerConfigs:
          additionalProperties:
            $ref: '#/components/schemas/RemediationScannerConfig'
          propertyNames:
            format: uuid
          title: Scannerconfigs
          type: object
        scannerPackageId:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Scannerpackageid
      required:
      - createdAt
      - rejected
      - projectIds
      - scannerConfigs
      title: RemediationDeployment
      type: object
    RequestConcurrencyLimit:
      properties:
        decayPerSecond:
          anyOf:
          - exclusiveMinimum: 0.0
            type: integer
          - type: 'null'
          description: 'Number of request slots that are opened per second.


            Set a value to use the concurrency limit as a rate limit.


            For example, to set a rate limit of 5 requests per second set requests=5 and decayPerSecond=5'
          title: Decaypersecond
        requests:
          description: Max number of request slots that can be occupied at once.
          exclusiveMinimum: 0.0
          title: Requests
          type: integer
      required:
      - requests
      title: RequestConcurrencyLimit
      type: object
    RemediationStatus:
      enum:
      - requested
      - in_progress
      - complete
      - error
      - implemented
      - deployed
      - cancelling
      - cancelled
      - rejected
      title: RemediationStatus
      type: string
    OperationalAttack:
      properties:
        severity:
          const: 1
          default: 1
          title: Severity
          type: integer
        technique:
          const: operational
          default: operational
          title: Technique
          type: string
        vector:
          $ref: '#/components/schemas/OperationalAttackVector'
      required:
      - vector
      title: OperationalAttack
      type: object
    CampaignRunStatus:
      enum:
      - scheduled
      - in_progress
      - complete
      - error
      - cancelling
      - cancelled
      - schedule_error
      title: CampaignRunStatus
      type: string
    PostRunCampaignBody:
      properties:
        campaignId:
          description: ID of the campaign to run. If empty, run all attacks.
          format: uuid
          title: Campaignid
          type: string
        name:
          description: Name to give the campaign run
          maxLength: 100
          minLength: 1
          title: Name
          type: string
        providerIds:
          description: IDs of the providers to target for the campaign
          items:
            format: uuid
            type: string
          maxItems: 5
          minItems: 1
          title: Providerids
          type: array
        remediationSettings:
          anyOf:
          - $ref: '#/components/schemas/CampaignRunRemediationSettings'
          - type: 'null'
          description: Remediation settings.
      required:
      - campaignId
      - providerIds
      - name
      title: PostRunCampaignBody
      type: object
    CampaignRunProviderErrors:
      properties:
        errorCount:
          title: Errorcount
          type: integer
        providerFailed:
          title: Providerfailed
          type: boolean
        providerName:
          title: Providername
          type: string
        totalPrompts:
          title: Totalprompts
          type: integer
      required:
      - providerName
      - errorCount
      - totalPrompts
      - providerFailed
      title: CampaignRunProviderErrors
      type: object
    CustomAttack:
      properties:
        fileId:
          format: uuid
          title: Fileid
          type: string
        name:
          title: Name
          type: string
        severity:
          anyOf:
          - maximum: 4.0
            minimum: 1.0
            type: integer
          - type: 'null'
          default: 1
          title: Severity
        technique:
          const: custom
          default: custom
          title: Technique
          type: string
      required:
      - name
      - fileId
      title: CustomAttack
      type: object
    AttackRunCompletedEvent:
      properties:
        createdAt:
          format: date-time
          title: Createdat
          type: string
        event:
          const: completed
          default: completed
          title: Event
          type: string
      required:
      - createdAt
      title: AttackRunCompletedEvent
