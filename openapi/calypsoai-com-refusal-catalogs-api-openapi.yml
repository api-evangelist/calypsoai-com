openapi: 3.2.0
info:
  title: CalypsoAI Refusal Catalogs API
  version: 1.0.0
servers:
- description: US1 availability zone
  url: https://us1.calypsoai.app
- description: EU1 availability zone
  url: https://eu1.calypsoai.app
tags:
- name: Refusal-Catalogs
paths:
  /backend/v1/refusal-catalogs:
    post:
      description: The most recent phrases are used at attack time. Pass an empty list to clear.
      operationId: post_refusal_catalogs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostRefusalCatalog'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostRefusalCatalogResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Set refusal catalog
      tags:
      - Refusal-Catalogs
  /backend/v1/refusal-catalogs/latest:
    get:
      description: Get the latest refusal catalog.
      operationId: get_refusal_catalogs_latest
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefusalCatalogResponse'
          description: Successful Response
      security:
      - HTTPBearer: []
      summary: Get the latest refusal catalog
      tags:
      - Refusal-Catalogs
  /backend/v1/refusal-catalogs/{refusalCatalogId}:
    get:
      description: Get refusal catalog by id.
      operationId: get_refusal_catalogs_refusalCatalogId
      parameters:
      - in: path
        name: refusalCatalogId
        required: true
        schema:
          format: uuid
          title: Refusalcatalogid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefusalCatalogResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Get refusal catalog by id
      tags:
      - Refusal-Catalogs
components:
  schemas:
    PostRefusalCatalog:
      properties:
        phrases:
          items:
            type: string
          title: Phrases
          type: array
      required:
      - phrases
      title: PostRefusalCatalog
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    PostRefusalCatalogResponse:
      properties:
        id:
          anyOf:
          - format: uuid
            type: string
          - type: string
          title: Id
        refusalCatalog:
          $ref: '#/components/schemas/RefusalCatalog'
      required:
      - id
      - refusalCatalog
      title: PostRefusalCatalogResponse
      type: object
    RefusalCatalogResponse:
      properties:
        refusalCatalog:
          $ref: '#/components/schemas/RefusalCatalog'
      required:
      - refusalCatalog
      title: RefusalCatalogResponse
      type: object
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
    RefusalCatalog:
      properties:
        createdAt:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Createdat
        createdBy:
          anyOf:
          - type: string
          - type: 'null'
          title: Createdby
        id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Id
        phrases:
          default: []
          items:
            type: string
          title: Phrases
          type: array
      title: RefusalCatalog
      type: object
  securitySchemes:
    HTTPBearer:
      scheme: bearer
      type: http
