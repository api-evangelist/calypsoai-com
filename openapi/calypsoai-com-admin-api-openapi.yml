openapi: 3.2.0
info:
  title: CalypsoAI Admin API
  version: 1.0.0
servers:
- description: US1 availability zone
  url: https://us1.calypsoai.app
- description: EU1 availability zone
  url: https://eu1.calypsoai.app
tags:
- name: Admin
paths:
  /backend/v1/admin/export:
    post:
      description: Exports all configuration data for the organization to be used for backup or migration purposes.
      operationId: post_admin_export
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostAdminSettingsExportBody'
          description: Successful Response
      security:
      - HTTPBearer: []
      summary: Create org settings backup
      tags:
      - Admin
  /backend/v1/admin/import:
    post:
      description: Restores organization configuration from a previously created backup.
      operationId: post_admin_import
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostAdmingSettingsImportBody'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Import org settings
      tags:
      - Admin
components:
  schemas:
    ScannerAvailability:
      properties:
        global:
          default: false
          description: If True guardrail can be used by all projects
          title: Global
          type: boolean
        projectIds:
          default: []
          items:
            format: uuid
            type: string
          title: Projectids
          type: array
          uniqueItems: true
      title: ScannerAvailability
      type: object
    ScannerVersionMeta:
      properties:
        createdAt:
          format: date-time
          title: Createdat
          type: string
        createdBy:
          anyOf:
          - type: string
          - type: 'null'
          title: Createdby
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        direction:
          anyOf:
          - $ref: '#/components/schemas/ScannerDirection'
          - type: 'null'
        f1Score:
          anyOf:
          - type: number
          - type: 'null'
          title: F1Score
        id:
          format: uuid
          title: Id
          type: string
        latestDatasetResult:
          anyOf:
          - $ref: '#/components/schemas/ScannerDatasetResult'
          - type: 'null'
        name:
          maxLength: 100
          minLength: 1
          pattern: ^[a-zA-Z0-9-_]+$
          title: Name
          type: string
        published:
          title: Published
          type: boolean
      required:
      - id
      - createdAt
      - name
      - published
      title: ScannerVersionMeta
      type: object
    ProjectType:
      enum:
      - app
      - bot
      - chat
      - global
      - agentic
      - red_team
      title: ProjectType
      type: string
    ProjectDeploymentStatus:
      enum:
      - live
      - draft
      title: ProjectDeploymentStatus
      type: string
    ScannerVersionInputModel:
      properties:
        description:
          anyOf:
          - type: string
          - type: 'null'
          description: Description of the changes in the new version.
          title: Description
        name:
          anyOf:
          - maxLength: 100
            minLength: 1
            pattern: ^[a-zA-Z0-9-_]+$
            type: string
          - type: 'null'
          description: Name for the new version.
          title: Name
        published:
          default: true
          description: If the version should be published.
          title: Published
          type: boolean
        push:
          default: false
          description: 'If the version should be pushed to all projects using the guardrail.

            Only has an effect if the version is published.'
          title: Push
          type: boolean
      title: ScannerVersionInputModel
      type: object
    APIScopeOutputs:
      patternProperties:
        ^[a-zA-Z_][a-zA-Z0-9_]*$:
          type: string
      template: true
      title: APIScopeOutputs
      type: object
    ProviderAvailability:
      properties:
        global:
          default: false
          description: If True provider can be used by all projects
          title: Global
          type: boolean
        projectIds:
          default: []
          items:
            format: uuid
            type: string
          title: Projectids
          type: array
          uniqueItems: true
      title: ProviderAvailability
      type: object
    APIWorkflowBlock:
      properties:
        outputs:
          $ref: '#/components/schemas/APIScopeOutputs'
          default: {}
        stages:
          items:
            discriminator:
              mapping:
                request: '#/components/schemas/APIRequestBlock'
                retry: '#/components/schemas/APIRetryBlock'
                workflow: '#/components/schemas/APIWorkflowBlock'
              propertyName: type
            oneOf:
            - $ref: '#/components/schemas/APIRequestBlock'
            - $ref: '#/components/schemas/APIRetryBlock'
            - $ref: '#/components/schemas/APIWorkflowBlock'
          template: true
          title: Stages
          type: array
        type:
          const: workflow
          default: workflow
          title: Type
          type: string
      required:
      - stages
      title: APIWorkflowBlock
      type: object
    Role:
      properties:
        id:
          format: uuid
          title: Id
          type: string
        isDefault:
          anyOf:
          - type: boolean
          - type: 'null'
          default: false
          title: Isdefault
        memberCount:
          title: Membercount
          type: integer
        name:
          title: Name
          type: string
        permissions:
          default: []
          items:
            type: string
          title: Permissions
          type: array
        projectId:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Projectid
        system:
          title: System
          type: boolean
      required:
      - id
      - name
      - system
      - memberCount
      title: Role
      type: object
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
    MLTextScannerConfig:
      properties:
        type:
          const: ml_text
          default: ml_text
          title: Type
          type: string
      required: []
      title: MLTextScannerConfig
      type: object
    ProviderType:
      enum:
      - ibm
      - openai
      - azure
      - cohere
      - ai21
      - custom
      - anthropic
      - groq
      - openai-compatible
      - huggingface
      - siem
      - google
      - bedrock
      title: ProviderType
      type: string
    ScannerPackage:
      properties:
        availability:
          $ref: '#/components/schemas/ScannerAvailability'
          default:
            global: false
            projectIds: []
        direction:
          $ref: '#/components/schemas/ScannerDirection'
        id:
          format: uuid
          title: Id
          type: string
        name:
          title: Name
          type: string
        performanceScannerIds:
          anyOf:
          - items:
              format: uuid
              type: string
            type: array
          - type: 'null'
          title: Performancescannerids
        projectId:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Projectid
        scannerCounts:
          additionalProperties:
            type: integer
          default: {}
          title: Scannercounts
          type: object
        scannerIds:
          items:
            format: uuid
            type: string
          title: Scannerids
          type: array
        source:
          discriminator:
            mapping:
              internal: '#/components/schemas/InternalScannerSource'
              remediation: '#/components/schemas/RemediationScannerSource'
              vendor: '#/components/schemas/VendorScannerSource'
              zip: '#/components/schemas/ZipScannerSource'
            propertyName: type
          oneOf:
          - $ref: '#/components/schemas/InternalScannerSource'
          - $ref: '#/components/schemas/ZipScannerSource'
          - $ref: '#/components/schemas/VendorScannerSource'
          - $ref: '#/components/schemas/RemediationScannerSource'
          title: Source
        vendored:
          anyOf:
          - type: boolean
          - items:
              type: string
            type: array
          default: false
          title: Vendored
      required:
      - id
      - name
      - source
      - direction
      - scannerIds
      title: ScannerPackage
      type: object
    RegexScannerConfig:
      properties:
        pattern:
          description: Python Flavored Regular Expression (RegEx) to check for in the prompt or response. Case insensitive.
          title: Pattern
          type: string
        type:
          const: regex
          default: regex
          title: Type
          type: string
      required:
      - pattern
      title: RegexScannerConfig
      type: object
    ZipScannerSource:
      properties:
        type:
          const: zip
          default: zip
          title: Type
          type: string
      title: ZipScannerSource
      type: object
    SuccessMessage:
      description: Confirms a successful operation.
      properties:
        message:
          title: Message
          type: string
      required:
      - message
      title: SuccessMessage
      type: object
    OrgExport:
      properties:
        settings:
          $ref: '#/components/schemas/ExportSettings'
        version:
          exclusiveMinimum: 0.0
          title: Version
          type: integer
      required:
      - version
      - settings
      title: OrgExport
      type: object
    ProjectConfig:
      properties:
        id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Id
        packages:
          default: []
          description: Packages configured for the project
          items:
            $ref: '#/components/schemas/ProjectConfigScanner'
          title: Packages
          type: array
        providers:
          default: []
          description: Providers available to the project
          items:
            $ref: '#/components/schemas/ProjectConfigProvider'
          title: Providers
          type: array
        scanners:
          default: []
          description: Guardrails configured for the project
          items:
            $ref: '#/components/schemas/ProjectConfigScanner'
          title: Scanners
          type: array
      title: ProjectConfig
      type: object
    ProjectConfigProvider:
      properties:
        capabilities:
          anyOf:
          - items:
              anyOf:
              - $ref: '#/components/schemas/ProviderCapability'
              - type: string
            type: array
            uniqueItems: true
          - type: 'null'
          title: Capabilities
        default:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Default
        enabled:
          title: Enabled
          type: boolean
        id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Id
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        type:
          anyOf:
          - type: string
          - type: 'null'
          title: Type
      required:
      - enabled
      title: ProjectConfigProvider
      type: object
    RemediationScannerSource:
      properties:
        sourceId:
          format: uuid
          title: Sourceid
          type: string
        type:
          const: remediation
          default: remediation
          title: Type
          type: string
      required:
      - sourceId
      title: RemediationScannerSource
      type: object
    VendorScannerSource:
      properties:
        type:
          const: vendor
          default: vendor
          title: Type
          type: string
      title: VendorScannerSource
      type: object
    ProviderCapability:
      enum:
      - chat
      - red_team
      - siem
      - openai_chat
      - openai_responses
      - anthropic_messages
      - google_generate_content
      title: ProviderCapability
      type: string
    Provider:
      properties:
        authTemplate:
          anyOf:
          - discriminator:
              mapping:
                request: '#/components/schemas/APIRequestBlock'
                retry: '#/components/schemas/APIRetryBlock'
                workflow: '#/components/schemas/APIWorkflowBlock'
              propertyName: type
            oneOf:
            - $ref: '#/components/schemas/APIRequestBlock'
            - $ref: '#/components/schemas/APIRetryBlock'
            - $ref: '#/components/schemas/APIWorkflowBlock'
          - type: 'null'
          description: Optional API template to retrieve temporary auth credentials
          title: Authtemplate
        availability:
          $ref: '#/components/schemas/ProviderAvailability'
          default:
            global: false
            projectIds: []
        capabilities:
          items:
            anyOf:
            - $ref: '#/components/schemas/ProviderCapability'
            - type: string
          title: Capabilities
          type: array
          uniqueItems: true
        hasLogo:
          default: false
          title: Haslogo
          type: boolean
        id:
          format: uuid
          title: Id
          type: string
        inputs:
          additionalProperties: true
          title: Inputs
          type: object
        maxRequestsPerSecond:
          anyOf:
          - type: integer
          - type: 'null'
          description: Deprecated, use requestConcurrencyLimit instead
          title: Maxrequestspersecond
        name:
          description: The name can be used to identify the provider instead of the id. It is case-sensitive, unique and can only contain letters, numbers and dashes.
          pattern: ^[a-zA-Z0-9-_]+$
          title: Name
          type: string
        projectId:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Projectid
        redTeam:
          default: false
          title: Redteam
          type: boolean
        requestConcurrencyLimit:
          anyOf:
          - $ref: '#/components/schemas/RequestConcurrencyLimit'
          - type: 'null'
          description: Specifies concurrency limits for requests from campaign run attacks
        secrets:
          additionalProperties:
            format: uuid
            type: string
          title: Secrets
          type: object
        siem:
          default: false
          title: Siem
          type: boolean
        systemProviderId:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Systemproviderid
        tag:
          anyOf:
          - type: string
          - type: 'null'
          title: Tag
        template:
          discriminator:
            mapping:
              request: '#/components/schemas/APIRequestBlock'
              retry: '#/components/schemas/APIRetryBlock'
              workflow: '#/components/schemas/APIWorkflowBlock'
            propertyName: type
          oneOf:
          - $ref: '#/components/schemas/APIRequestBlock'
          - $ref: '#/components/schemas/APIRetryBlock'
          - $ref: '#/components/schemas/APIWorkflowBlock'
          title: Template
        type:
          $ref: '#/components/schemas/ProviderType'
      required:
      - id
      - name
      - type
      - template
      - inputs
      - secrets
      - capabilities
      title: Provider
      type: object
    OCIAuth:
      properties:
        keyId:
          template: true
          title: Keyid
          type: string
        passphrase:
          anyOf:
          - type: string
          - type: 'null'
          template: true
          title: Passphrase
        privateKeyPem:
          template: true
          title: Privatekeypem
          type: string
      required:
      - keyId
      - privateKeyPem
      title: OCIAuth
      type: object
    ScanMode:
      enum:
      - block
      - audit
      - redact
      title: ScanMode
      type: string
    Project:
      properties:
        adminCount:
          default: 0
          title: Admincount
          type: integer
        adminRoleId:
          format: uuid
          title: Adminroleid
          type: string
        agentSessionCount:
          anyOf:
          - type: integer
          - type: 'null'
          title: Agentsessioncount
        botType:
          anyOf:
          - $ref: '#/components/schemas/ChatbotType'
          - type: 'null'
        chatbotId:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Chatbotid
        config:
          $ref: '#/components/schemas/ProjectConfig'
        createdAt:
          format: date-time
          title: Createdat
          type: string
        createdBy:
          title: Createdby
          type: string
        deploymentStatus:
          $ref: '#/components/schemas/ProjectDeploymentStatus'
          default: draft
        friendlyId:
          anyOf:
          - maxLength: 100
            minLength: 1
            pattern: ^[a-zA-Z0-9-_]+$
            type: string
          - type: 'null'
          description: The name can be used to identify the project instead of the id. It is case-sensitive, unique and can only contain letters, numbers and dashes.
          title: Friendlyid
        id:
          format: uuid
          title: Id
          type: string
        memberCount:
          default: 0
          title: Membercount
          type: integer
        memberRoleId:
          format: uuid
          title: Memberroleid
          type: string
        name:
          maxLength: 100
          minLength: 1
          title: Name
          type: string
        providerCount:
          anyOf:
          - type: integer
          - type: 'null'
          title: Providercount
        scannerCount:
          anyOf:
          - type: integer
          - type: 'null'
          title: Scannercount
        tokenCount:
          anyOf:
          - type: integer
          - type: 'null'
          title: Tokencount
        type:
          $ref: '#/components/schemas/ProjectType'
        updatedAt:
          format: date-time
          title: Updatedat
          type: string
      required:
      - id
      - name
      - type
      - config
      - createdAt
      - createdBy
      - updatedAt
      - adminRoleId
      - memberRoleId
      - tokenCount
      - providerCount
      - scannerCount
      title: Project
      type: object
    Secret:
      properties:
        deletedAt:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Deletedat
        id:
          format: uuid
          title: Id
          type: string
        name:
          title: Name
          type: string
        value:
          format: password
          title: Value
          type: string
          writeOnly: true
      required:
      - id
      - name
      - value
      title: Secret
      type: object
    Scanner:
      properties:
        availability:
          $ref: '#/components/schemas/ScannerAvailability'
          default:
            global: false
            projectIds: []
        config:
          anyOf:
          - discriminator:
              mapping:
                custom: '#/components/schemas/GenAIScannerConfig'
                genai: '#/components/schemas/GenAIScannerConfig'
                keyword: '#/components/schemas/KeywordScannerConfig'
                ml_text: '#/components/schemas/MLTextScannerConfig'
                regex: '#/components/schemas/RegexScannerConfig'
              propertyName: type
            oneOf:
            - $ref: '#/components/schemas/RegexScannerConfig'
            - $ref: '#/components/schemas/KeywordScannerConfig'
            - $ref: '#/components/schemas/GenAIScannerConfig'
            - $ref: '#/components/schemas/MLTextScannerConfig'
          - $ref: '#/components/schemas/LegacyScannerConfig'
          - type: 'null'
          title: Config
        direction:
          $ref: '#/components/schemas/ScannerDirection'
          default: request
        id:
          format: uuid
          title: Id
          type: string
        name:
          title: Name
          type: string
        packageId:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Packageid
        projectId:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Projectid
        scannerTemplateId:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Scannertemplateid
        source:
          default:
            type: internal
          discriminator:
            mapping:
              internal: '#/components/schemas/InternalScannerSource'
              remediation: '#/components/schemas/RemediationScannerSource'
              vendor: '#/components/schemas/VendorScannerSource'
              zip: '#/components/schemas/ZipScannerSource'
            propertyName: type
          oneOf:
          - $ref: '#/components/schemas/InternalScannerSource'
          - $ref: '#/components/schemas/ZipScannerSource'
          - $ref: '#/components/schemas/VendorScannerSource'
          - $ref: '#/components/schemas/RemediationScannerSource'
          title: Source
        tags:
          default: []
          items:
            maxLength: 50
            minLength: 1
            pattern: ^[a-zA-Z0-9-_]+$
            type: string
          title: Tags
          type: array
        vendored:
          anyOf:
          - type: boolean
          - items:
              type: string
            type: array
          default: false
          title: Vendored
        versionMeta:
          $ref: '#/components/schemas/ScannerVersionMeta'
      required:
      - name
      - id
      - versionMeta
      title: Scanner
      type: object
    PostAdmingSettingsImportBody:
      properties:
        clearExisting:
          default: false
          description: If true, all existing data belonging to your organization will be deleted. This is not reversible.
          title: Clearexisting
          type: boolean
        export:
          $ref: '#/components/schemas/OrgExport'
          description: Previously exported data to restore to the organization.
        preserveRoles:
          default: false
          description: If true and clearExisting is true, users will preserve the roles they have at time of import.
          title: Preserveroles
          type: boolean
        preserveTokens:
          default: false
          description: 'If true and clearExisting is true, personal API tokens will be preserved."

            Machine tokens will not be preserved.'
          title: Preservetokens
          type: boolean
      required:
      - export
      title: PostAdmingSettingsImportBody
      type: object
    RequestConcurrencyLimit:
      properties:
        decayPerSecond:
          anyOf:
          - exclusiveMinimum: 0.0
            type: integer
          - type: 'null'
          description: 'Number of request slots that are opened per second.


            Set a value to use the concurrency limit as a rate limit.


            For example, to set a rate limit of 5 requests per second set requests=5 and decayPerSecond=5'
          title: Decaypersecond
        requests:
          description: Max number of request slots that can be occupied at once.
          exclusiveMinimum: 0.0
          title: Requests
          type: integer
      required:
      - requests
      title: RequestConcurrencyLimit
      type: object
    LegacyScannerConfig:
      additionalProperties: true
      properties: {}
      title: LegacyScannerConfig
      type: object
    InternalScannerSource:
      properties:
        type:
          const: internal
          default: internal
          title: Type
          type: string
      title: InternalScannerSource
      type: object
    KeywordScannerConfig:
      properties:
        type:
          const: keyword
          default: keyword
          title: Type
          type: string
        words:
          description: Words to check for in the prompt or response. Case insensitive. Empty strings will be removed.
          items:
            type: string
          title: Words
          type: array
      required:
      - words
      title: KeywordScannerConfig
      type: object
    ScannerDatasetResult:
      properties:
        datasetRunId:
          format: uuid
          title: Datasetrunid
          type: string
        f1Score:
          title: F1Score
          type: number
      required:
      - datasetRunId
      - f1Score
      title: ScannerDatasetResult
      type: object
    AWSAuth:
      properties:
        accessKey:
          anyOf:
          - type: string
          - type: 'null'
          template: true
          title: Accesskey
        region:
          template: true
          title: Region
          type: string
        secretKey:
          anyOf:
          - type: string
          - type: 'null'
          template: true
          title: Secretkey
        service:
          template: true
          title: Service
          type: string
        token:
          anyOf:
          - type: string
          - type: 'null'
          template: true
          title: Token
      required:
      - service
      - region
      title: AWSAuth
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    ChatbotType:
      enum:
      - teams
      - slack
      title: ChatbotType
      type: string
    APIRetryBlock:
      properties:
        attempts:
          title: Attempts
          type: integer
        backoff:
          anyOf:
          - type: integer
          - type: string
          default: 1
          template: true
          title: Backoff
        block:
          discriminator:
            mapping:
              request: '#/components/schemas/APIRequestBlock'
              retry: '#/components/schemas/APIRetryBlock'
              workflow: '#/components/schemas/APIWorkflowBlock'
            propertyName: type
          oneOf:
          - $ref: '#/components/schemas/APIRequestBlock'
          - $ref: '#/components/schemas/APIWorkflowBlock'
          - $ref: '#/components/schemas/APIRetryBlock'
          template: true
          title: Block
        type:
          const: retry
          default: retry
          title: Type
          type: string
        when:
          anyOf:
          - type: string
          - type: 'null'
          template: true
          title: When
      required:
      - attempts
      - block
      title: APIRetryBlock
      type: object
    ScannerExport:
      properties:
        availability:
