openapi: 3.2.0
info:
  title: CalypsoAI Audit API
  version: 1.0.0
servers:
- description: US1 availability zone
  url: https://us1.calypsoai.app
- description: EU1 availability zone
  url: https://eu1.calypsoai.app
tags:
- name: Audit
paths:
  /backend/v1/audit:
    get:
      description: Retrieves a paginated list of events that detail the configuration history of the app.
      operationId: get_audit
      parameters:
      - description: "\n                Selects page for paginated results. Pass in the next or prev attribute in the response.\n            "
        in: query
        name: cursor
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: "\n                Selects page for paginated results. Pass in the next or prev attribute in the response.\n            "
          title: Cursor
      - description: Only return results that match the given text.
        in: query
        name: search
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Only return results that match the given text.
          title: Search
      - description: Limits the amount of results.
        in: query
        name: limit
        required: false
        schema:
          default: 10
          description: Limits the amount of results.
          maximum: 100
          minimum: 1
          title: Limit
          type: integer
      - description: Whether results should be sorted in ascending order.
        in: query
        name: ascending
        required: false
        schema:
          default: false
          description: Whether results should be sorted in ascending order.
          title: Ascending
          type: boolean
      - description: Only return results from before this timestamp.
        in: query
        name: before
        required: false
        schema:
          anyOf:
          - format: date-time
            type: string
          - format: uuid
            type: string
          - type: 'null'
          description: Only return results from before this timestamp.
          title: Before
      - description: Only return results from after this timestamp.
        in: query
        name: after
        required: false
        schema:
          anyOf:
          - format: date-time
            type: string
          - format: uuid
            type: string
          - type: 'null'
          description: Only return results from after this timestamp.
          title: After
      - description: Only return specific types of audit events.
        in: query
        name: type
        required: false
        schema:
          default: []
          description: Only return specific types of audit events.
          items:
            anyOf:
            - $ref: '#/components/schemas/AuditEventType'
            - type: string
          title: Type
          type: array
      - description: Only return audit events created by specified user.
        in: query
        name: userId
        required: false
        schema:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          description: Only return audit events created by specified user.
          title: Userid
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAuditResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Get audit events
      tags:
      - Audit
  /backend/v1/audit/{eventId}:
    get:
      description: Retrieves an event by its ID.
      operationId: get_audit_eventId
      parameters:
      - in: path
        name: eventId
        required: true
        schema:
          format: uuid
          title: Eventid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAuditEventResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Get event
      tags:
      - Audit
