openapi: 3.2.0
info:
  title: CalypsoAI License API
  version: 1.0.0
servers:
- description: US1 availability zone
  url: https://us1.calypsoai.app
- description: EU1 availability zone
  url: https://eu1.calypsoai.app
tags:
- name: License
paths:
  /backend/v1/license:
    get:
      description: Return license status for on-premise installations.
      operationId: get_license
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetLicenseResponse'
          description: Successful Response
      security:
      - HTTPBearer: []
      summary: Get license status
      tags:
      - License
    patch:
      description: Update the license for the system.
      operationId: patch_license
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchLicenseBody'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Update license
      tags:
      - License
components:
  schemas:
    PatchLicenseBody:
      properties:
        license:
          description: The license to be applied to the system
          minLength: 1
          title: License
          type: string
      required:
      - license
      title: PatchLicenseBody
      type: object
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
    GetLicenseResponse:
      properties:
        license:
          $ref: '#/components/schemas/LicenseStatus'
      required:
      - license
      title: GetLicenseResponse
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    SuccessMessage:
      description: Confirms a successful operation.
      properties:
        message:
          title: Message
          type: string
      required:
      - message
      title: SuccessMessage
      type: object
    LicenseStatus:
      properties:
        expiry:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Expiry
        hash:
          anyOf:
          - type: string
          - type: 'null'
          title: Hash
        status:
          title: Status
          type: string
      required:
      - status
      title: LicenseStatus
      type: object
  securitySchemes:
    HTTPBearer:
      scheme: bearer
      type: http
