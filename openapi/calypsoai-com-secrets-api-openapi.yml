openapi: 3.2.0
info:
  title: CalypsoAI Secrets API
  version: 1.0.0
servers:
- description: US1 availability zone
  url: https://us1.calypsoai.app
- description: EU1 availability zone
  url: https://eu1.calypsoai.app
tags:
- name: Secrets
paths:
  /backend/v1/secrets:
    get:
      description: Retrieves all available secrets, with their values obfuscated.
      operationId: get_secrets
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetSecretsResponse'
          description: Successful Response
      security:
      - HTTPBearer: []
      summary: Get secrets
      tags:
      - Secrets
    post:
      description: Creates a secret. The value will not be accessible through the API after creation.
      operationId: post_secrets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostSecretsBody'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostSuccessMessage'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Create secret
      tags:
      - Secrets
  /backend/v1/secrets/{secretId}:
    delete:
      description: Deletes a secret by its ID.
      operationId: delete_secrets_secretId
      parameters:
      - in: path
        name: secretId
        required: true
        schema:
          format: uuid
          title: Secretid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Delete secret
      tags:
      - Secrets
    get:
      description: Retrieves a secret by its ID.
      operationId: get_secrets_secretId
      parameters:
      - in: path
        name: secretId
        required: true
        schema:
          format: uuid
          title: Secretid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetSecretResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Get secret
      tags:
      - Secrets
    patch:
      description: Updates a secret by its ID, including the name and value.
      operationId: patch_secrets_secretId
      parameters:
      - in: path
        name: secretId
        required: true
        schema:
          format: uuid
          title: Secretid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchSecretBody'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Update secret
      tags:
      - Secrets
components:
  schemas:
    Secret:
      properties:
        deletedAt:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Deletedat
        id:
          format: uuid
          title: Id
          type: string
        name:
          title: Name
          type: string
        value:
          format: password
          title: Value
          type: string
          writeOnly: true
      required:
      - id
      - name
      - value
      title: Secret
      type: object
    PatchSecretBody:
      properties:
        name:
          anyOf:
          - type: string
          - type: 'null'
          description: New name for the secret.
          title: Name
        value:
          anyOf:
          - type: string
          - type: 'null'
          description: New value for the secret.
          title: Value
      title: PatchSecretBody
      type: object
    PostSuccessMessage:
      description: Contains the ID of an object after a successful POST operation.
      properties:
        id:
          anyOf:
          - format: uuid
            type: string
          - type: string
          title: Id
      required:
      - id
      title: PostSuccessMessage
      type: object
    PostSecretsBody:
      properties:
        name:
          description: Name of the newly created secret.
          title: Name
          type: string
        value:
          description: Value of the newly created secret.
          title: Value
          type: string
      required:
      - name
      - value
      title: PostSecretsBody
      type: object
    GetSecretResponse:
      properties:
        secret:
          $ref: '#/components/schemas/Secret'
          description: Requested secret object with the value obfuscated.
      required:
      - secret
      title: GetSecretResponse
      type: object
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    GetSecretsResponse:
      properties:
        secrets:
          description: All secrets available, with their values obfuscated.
          items:
            $ref: '#/components/schemas/Secret'
          title: Secrets
          type: array
      required:
      - secrets
      title: GetSecretsResponse
      type: object
    SuccessMessage:
      description: Confirms a successful operation.
      properties:
        message:
          title: Message
          type: string
      required:
      - message
      title: SuccessMessage
      type: object
  securitySchemes:
    HTTPBearer:
      scheme: bearer
      type: http
